<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Race to 100 — Dice Game Score Tracker</title>
<style>
  :root {
    --bg: #0a1830;
    --panel: #102544;
    --panel-2: #16305a;
    --border: #24406b;
    --text: #f4f7fb;
    --muted: #9bb0d1;
    --red: #e6394f;
    --red-deep: #b91c2c;
    --blue: #4f9ddb;
    --white: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(120% 160% at 50% -10%, #132a4d 0%, #0a1830 55%, #071224 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px 16px 60px;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }
  .top { text-align: center; margin-bottom: 8px; }
  h1 {
    font-size: 1.8rem;
    margin: 8px 0 6px;
    letter-spacing: 0.5px;
    background: linear-gradient(180deg, #ffffff, var(--blue));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    color: var(--muted);
    margin-bottom: 4px;
    font-size: 0.95rem;
  }
  .tri-rule {
    width: 84px;
    height: 4px;
    margin: 14px auto 24px;
    border-radius: 999px;
    overflow: hidden;
    display: flex;
  }
  .tri-rule span { flex: 1; }
  .tri-rule .r { background: var(--red); }
  .tri-rule .w { background: #ffffff; }
  .tri-rule .b { background: var(--blue); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  }
  .card h2 {
    margin: 0 0 14px;
    font-size: 1.1rem;
    color: var(--white);
  }
  .row {
    display: flex;
    gap: 8px;
  }
  input[type="text"], input[type="number"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 1rem;
    min-width: 0;
  }
  input:focus { outline: 2px solid var(--blue); }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.95rem;
    font-weight: 600;
    transition: transform 0.05s ease, opacity 0.15s ease, filter 0.15s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .btn-primary { background: var(--red); color: #ffffff; }
  .btn-secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn-add { background: var(--blue); color: #072238; }
  .btn-zero { background: var(--red-deep); color: #ffffff; }
  .btn-stay { background: #ffffff; color: #0a1830; }

  .player-list {
    list-style: none;
    margin: 14px 0 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .player-chip {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 10px 6px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
  }
  .player-chip button {
    background: transparent;
    color: var(--muted);
    padding: 2px 6px;
    font-size: 0.9rem;
  }
  .player-chip button:hover { color: var(--red); filter: none; }

  .hint { color: var(--muted); font-size: 0.85rem; margin-top: 10px; }

  .money-row { margin-top: 16px; }
  .money-row .hint:first-child { margin-top: 0; margin-bottom: 6px; }
  .money-input-wrap {
    display: flex;
    align-items: center;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 14px;
  }
  .money-input-wrap .dollar-sign { color: var(--muted); font-weight: 700; }
  .money-input-wrap input {
    border: none;
    background: transparent;
    padding: 12px 8px 12px 6px;
    flex: 1;
  }
  .money-input-wrap input:focus { outline: none; }
  .money-input-wrap:focus-within { outline: 2px solid var(--blue); }
  .payout-amount { color: var(--red); }

  .status-banner {
    text-align: center;
    padding: 10px 14px;
    border-radius: 10px;
    font-weight: 700;
    margin-bottom: 16px;
    font-size: 1rem;
  }
  .status-playing { background: rgba(79, 157, 219, 0.16); color: var(--blue); }
  .status-endgame { background: rgba(230, 57, 79, 0.2); color: #ff8a95; }
  .status-over { background: rgba(255, 255, 255, 0.14); color: #ffffff; font-size: 1.15rem; }

  .turn-line {
    text-align: center;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .turn-line strong { color: var(--text); }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 16px;
  }
  th, td {
    text-align: left;
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
  tr.current-turn td { background: rgba(79, 157, 219, 0.1); }
  tr.current-turn td:first-child { border-left: 3px solid var(--blue); padding-left: 6px; }
  .score-cell { font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    background: var(--red);
    color: #ffffff;
  }
  .winner-row td { color: #ffffff; font-weight: 800; }

  .action-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }
  @media (max-width: 420px) {
    .action-buttons { grid-template-columns: 1fr 1fr; }
    .btn-stay { grid-column: span 2; }
  }

  .log {
    max-height: 160px;
    overflow-y: auto;
    font-size: 0.85rem;
    color: var(--muted);
    display: flex;
    flex-direction: column-reverse;
    gap: 4px;
    padding-right: 4px;
  }
  .log div { border-bottom: 1px dashed var(--border); padding-bottom: 4px; }

  .error { color: var(--red); font-size: 0.85rem; margin-top: 8px; min-height: 1em; }

  .footer-actions {
    display: flex;
    justify-content: center;
    margin-top: 4px;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🎲 Race to 100</h1>
    <p class="subtitle">Score tracker — add, reset, or hold. First to reach 100 must defend the lead.</p>
    <div class="tri-rule" aria-hidden="true"><span class="r"></span><span class="w"></span><span class="b"></span></div>
  </div>

  <div id="setup-screen" class="card">
    <h2>Players</h2>
    <div class="row">
      <input type="text" id="player-name-input" placeholder="Enter player name" maxlength="24" />
      <button class="btn-primary" id="add-player-btn">Add</button>
    </div>
    <ul class="player-list" id="player-list"></ul>
    <p class="hint" id="setup-hint">Add at least 2 players to start.</p>
    <div class="error" id="setup-error"></div>

    <div class="money-row">
      <label for="money-per-point-input" class="hint">Money per point (optional)</label>
      <div class="money-input-wrap">
        <span class="dollar-sign">$</span>
        <input type="number" id="money-per-point-input" placeholder="0.25" min="0" step="0.01" />
      </div>
      <p class="hint">Leave blank to play without money stakes.</p>
    </div>

    <div class="footer-actions">
      <button class="btn-primary" id="start-game-btn" disabled>Start Game</button>
    </div>
  </div>

  <div id="game-screen" hidden>
    <div class="status-banner" id="status-banner"></div>
    <div class="turn-line" id="turn-line"></div>

    <div class="card" id="action-card">
      <h2>Take a turn</h2>
      <div class="row">
        <input type="number" id="amount-input" placeholder="Points" min="0" inputmode="numeric" />
      </div>
      <div class="action-buttons">
        <button class="btn-add" id="add-btn">➕ Add</button>
        <button class="btn-zero" id="zero-btn">🔁 Back to Zero</button>
        <button class="btn-stay" id="stay-btn">🤝 Stay Same</button>
      </div>
      <div class="error" id="action-error"></div>
    </div>

    <div class="card">
      <h2>Scoreboard</h2>
      <table>
        <thead>
          <tr><th>Player</th><th>Score</th></tr>
        </thead>
        <tbody id="scoreboard-body"></tbody>
      </table>
    </div>

    <div class="card" id="payouts-card" hidden>
      <h2>💵 Payouts</h2>
      <table>
        <thead>
          <tr><th>Player</th><th>Owes Winner</th></tr>
        </thead>
        <tbody id="payouts-body"></tbody>
      </table>
      <p class="hint" id="payouts-total"></p>
    </div>

    <div class="card">
      <h2>Activity</h2>
      <div class="log" id="log"></div>
    </div>

    <div class="footer-actions">
      <button class="btn-secondary" id="new-game-btn">New Game</button>
    </div>
  </div>
</div>

<script>
(function () {
  const WIN_SCORE = 100;

  let players = [];       // {name, score}
  let phase = 'setup';    // setup | playing | endgame | over
  let currentPlayerIndex = 0;
  let kingIndex = null;   // current highest-scoring player once someone reaches 100
  let queue = [];         // players still owed their one chance to beat the king this round
  let winnerIndex = null;
  let log = [];

  const setupScreen = document.getElementById('setup-screen');
  const gameScreen = document.getElementById('game-screen');
  const playerNameInput = document.getElementById('player-name-input');
  const addPlayerBtn = document.getElementById('add-player-btn');
  const playerListEl = document.getElementById('player-list');
  const setupError = document.getElementById('setup-error');
  const startGameBtn = document.getElementById('start-game-btn');
  const moneyPerPointInput = document.getElementById('money-per-point-input');

  const statusBanner = document.getElementById('status-banner');
  const turnLine = document.getElementById('turn-line');
  const amountInput = document.getElementById('amount-input');
  const addBtn = document.getElementById('add-btn');
  const zeroBtn = document.getElementById('zero-btn');
  const stayBtn = document.getElementById('stay-btn');
  const actionError = document.getElementById('action-error');
  const scoreboardBody = document.getElementById('scoreboard-body');
  const logEl = document.getElementById('log');
  const newGameBtn = document.getElementById('new-game-btn');
  const actionCard = document.getElementById('action-card');
  const payoutsCard = document.getElementById('payouts-card');
  const payoutsBody = document.getElementById('payouts-body');
  const payoutsTotal = document.getElementById('payouts-total');

  let setupPlayers = [];
  let moneyPerPoint = 0;

  function renderSetup() {
    playerListEl.innerHTML = '';
    setupPlayers.forEach((name, i) => {
      const li = document.createElement('li');
      li.className = 'player-chip';
      li.innerHTML = '<span></span><button type="button" aria-label="Remove">✕</button>';
      li.querySelector('span').textContent = name;
      li.querySelector('button').addEventListener('click', () => {
        setupPlayers.splice(i, 1);
        renderSetup();
      });
      playerListEl.appendChild(li);
    });
    startGameBtn.disabled = setupPlayers.length < 2;
  }

  function addPlayerFromInput() {
    const name = playerNameInput.value.trim();
    setupError.textContent = '';
    if (!name) return;
    if (setupPlayers.some(p => p.toLowerCase() === name.toLowerCase())) {
      setupError.textContent = 'That name is already added.';
      return;
    }
    setupPlayers.push(name);
    playerNameInput.value = '';
    playerNameInput.focus();
    renderSetup();
  }

  addPlayerBtn.addEventListener('click', addPlayerFromInput);
  playerNameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addPlayerFromInput(); }
  });

  startGameBtn.addEventListener('click', () => {
    if (setupPlayers.length < 2) return;
    players = setupPlayers.map(name => ({ name, score: 0 }));
    const rawMoney = Number(moneyPerPointInput.value);
    moneyPerPoint = (moneyPerPointInput.value.trim() !== '' && rawMoney > 0) ? rawMoney : 0;
    phase = 'playing';
    currentPlayerIndex = 0;
    kingIndex = null;
    queue = [];
    winnerIndex = null;
    log = [];
    addLog(`Game started with ${players.map(p => p.name).join(', ')}.`);
    setupScreen.hidden = true;
    gameScreen.hidden = false;
    renderGame();
    focusAmount();
  });

  function addLog(text) {
    log.push(text);
    if (log.length > 100) log.shift();
  }

  function focusAmount() {
    if (phase === 'playing' || phase === 'endgame') {
      amountInput.value = '';
      amountInput.focus();
    }
  }

  function otherPlayersInOrder(fromIndex) {
    const others = [];
    let i = (fromIndex + 1) % players.length;
    while (i !== fromIndex) {
      others.push(i);
      i = (i + 1) % players.length;
    }
    return others;
  }

  function crownKing(newKingIdx) {
    kingIndex = newKingIdx;
    queue = otherPlayersInOrder(kingIndex);
  }

  function advanceTurn(actedIdx) {
    if (phase === 'playing') {
      if (players[actedIdx].score >= WIN_SCORE) {
        crownKing(actedIdx);
        if (queue.length === 0) {
          phase = 'over';
          winnerIndex = kingIndex;
          addLog(`🏆 ${players[kingIndex].name} wins the game!`);
          return;
        }
        addLog(`${players[kingIndex].name} reached ${WIN_SCORE} with ${players[kingIndex].score}! Everyone else gets one chance to beat it.`);
        phase = 'endgame';
        currentPlayerIndex = queue.shift();
      } else {
        currentPlayerIndex = (actedIdx + 1) % players.length;
      }
    } else if (phase === 'endgame') {
      if (players[actedIdx].score > players[kingIndex].score) {
        crownKing(actedIdx);
        addLog(`${players[kingIndex].name} takes the lead with ${players[kingIndex].score}! Everyone else gets one more chance to beat it.`);
      }
      if (queue.length > 0) {
        currentPlayerIndex = queue.shift();
      } else {
        phase = 'over';
        winnerIndex = kingIndex;
        addLog(`🏆 ${players[kingIndex].name} wins the game with ${players[kingIndex].score}!`);
      }
    }
  }

  function handleAction(type) {
    if (phase === 'over') return;
    actionError.textContent = '';
    const idx = currentPlayerIndex;
    let amount = 0;

    if (type === 'add') {
      const raw = amountInput.value.trim();
      if (raw === '' || isNaN(raw) || Number(raw) < 0) {
        actionError.textContent = 'Enter a non-negative number of points.';
        return;
      }
      amount = Math.floor(Number(raw));
    }

    const name = players[idx].name;
    if (type === 'add') {
      players[idx].score += amount;
      addLog(`${name} added ${amount} → ${players[idx].score}.`);
    } else if (type === 'zero') {
      players[idx].score = 0;
      addLog(`${name} went back to zero.`);
    } else {
      addLog(`${name} stayed the same at ${players[idx].score}.`);
    }

    advanceTurn(idx);
    renderGame();
    focusAmount();
  }

  addBtn.addEventListener('click', () => handleAction('add'));
  zeroBtn.addEventListener('click', () => handleAction('zero'));
  stayBtn.addEventListener('click', () => handleAction('stay'));
  amountInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); handleAction('add'); }
  });

  newGameBtn.addEventListener('click', () => {
    if (phase !== 'over' && !confirm('Start a new game? Current progress will be lost.')) return;
    players = [];
    setupPlayers = [];
    phase = 'setup';
    currentPlayerIndex = 0;
    kingIndex = null;
    queue = [];
    winnerIndex = null;
    log = [];
    moneyPerPoint = 0;
    moneyPerPointInput.value = '';
    gameScreen.hidden = true;
    setupScreen.hidden = false;
    renderSetup();
    playerNameInput.focus();
  });

  function formatMoney(amount) {
    return `$${amount.toFixed(2)}`;
  }

  function renderPayouts() {
    if (phase !== 'over' || moneyPerPoint <= 0 || winnerIndex === null) {
      payoutsCard.hidden = true;
      return;
    }
    payoutsCard.hidden = false;
    const winner = players[winnerIndex];
    payoutsBody.innerHTML = '';
    let total = 0;
    players.forEach((p, i) => {
      if (i === winnerIndex) return;
      const owed = (winner.score - p.score) * moneyPerPoint;
      total += owed;
      const tr = document.createElement('tr');
      const nameTd = document.createElement('td');
      nameTd.textContent = p.name;
      const amountTd = document.createElement('td');
      amountTd.className = 'score-cell payout-amount';
      amountTd.textContent = formatMoney(owed);
      tr.appendChild(nameTd);
      tr.appendChild(amountTd);
      payoutsBody.appendChild(tr);
    });
    payoutsTotal.textContent = `${winner.name} collects ${formatMoney(total)} total.`;
  }

  function renderGame() {
    const inEndgame = phase === 'endgame';

    if (phase === 'playing') {
      statusBanner.className = 'status-banner status-playing';
      statusBanner.textContent = `Playing — race to ${WIN_SCORE}`;
    } else if (phase === 'endgame') {
      statusBanner.className = 'status-banner status-endgame';
      statusBanner.textContent = `${players[kingIndex].name} leads with ${players[kingIndex].score} — everyone else gets one chance to beat it!`;
    } else if (phase === 'over') {
      statusBanner.className = 'status-banner status-over';
      statusBanner.textContent = winnerIndex !== null ? `🏆 ${players[winnerIndex].name} wins!` : 'Game over.';
    }

    if (phase === 'over') {
      turnLine.textContent = '';
      actionCard.hidden = true;
    } else {
      actionCard.hidden = false;
      turnLine.innerHTML = inEndgame
        ? `It's <strong>${players[currentPlayerIndex].name}</strong>'s turn — beat <strong>${players[kingIndex].score}</strong> to win!`
        : `It's <strong>${players[currentPlayerIndex].name}</strong>'s turn`;
    }

    scoreboardBody.innerHTML = '';
    players.forEach((p, i) => {
      const tr = document.createElement('tr');
      if (phase !== 'over' && i === currentPlayerIndex) tr.classList.add('current-turn');
      if (phase === 'over' && i === winnerIndex) tr.classList.add('winner-row');

      const nameTd = document.createElement('td');
      nameTd.textContent = (inEndgame && i === kingIndex) ? `🏆 ${p.name}` : p.name;
      if (p.score >= WIN_SCORE) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = '100+';
        nameTd.appendChild(badge);
      }

      const scoreTd = document.createElement('td');
      scoreTd.className = 'score-cell';
      scoreTd.textContent = p.score;

      tr.appendChild(nameTd);
      tr.appendChild(scoreTd);
      scoreboardBody.appendChild(tr);
    });

    logEl.innerHTML = '';
    log.slice().reverse().forEach(entry => {
      const div = document.createElement('div');
      div.textContent = entry;
      logEl.appendChild(div);
    });

    renderPayouts();
  }

  renderSetup();
})();
</script>
</body>
</html>
